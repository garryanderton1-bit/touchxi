/* D09: scoped premium squad roster */
.squad-roster{padding:0;overflow:hidden}.squad-heading{padding:16px 16px 12px}.squad-heading strong{font-size:17px}.squad-roster .list{gap:0}.squad-roster .squad-player{display:flex;align-items:center;gap:12px;width:100%;min-height:72px;padding:10px 14px;border:0;border-top:1px solid var(--surface-2);border-radius:0;background:transparent;text-align:left;color:inherit}.squad-player:active{background:var(--surface-2)}.squad-number{width:27px;flex-shrink:0;text-align:center;font-size:18px;font-weight:700;color:var(--muted)}.squad-avatar{width:44px;height:44px;flex:0 0 44px;border-radius:50%;overflow:hidden;background:var(--surface-2);display:grid;place-items:center;font-size:13px;font-weight:700}.squad-avatar img{width:100%;height:100%;object-fit:cover}.squad-name{display:block;font-size:15px;font-weight:700;line-height:1.3}.squad-positions{display:block;font-size:12px;line-height:1.5;color:var(--muted);margin-top:3px}.squad-chevron{font-size:22px;font-weight:400}.squad-player .main{min-width:0;flex:1}
.honour-cabinet{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:14px 8px 10px;border:5px solid #72503a;border-radius:10px;background:linear-gradient(145deg,#172337,#304052);box-shadow:inset 0 3px 12px #0008}.honour-display{min-width:0;display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 3px 12px;border:0;border-bottom:6px solid #a77a4e;background:transparent;color:#fff;text-align:center;cursor:pointer}.honour-display svg{width:70px;max-width:100%;filter:drop-shadow(0 3px 3px #0008)}.honour-display strong{font-size:12px;overflow-wrap:anywhere}.honour-display small{font-size:10px;color:#e3d3b8}.honour-empty{grid-column:1/-1;color:#e3d3b8;text-align:center;padding:12px}
.fixture-venue{justify-content:space-between;text-align:left;padding-inline:16px}.fixture-venue small{display:block;font-size:12px;font-weight:500;opacity:.8;margin-top:2px}.match-more summary{min-width:36px;min-height:40px;border:0;font-size:24px;line-height:1}.match-more button{top:42px;z-index:20}.score-v2 [data-a="openTactical"]{width:100%;min-height:44px!important}
.recent-form-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}.recent-result{border:0;border-radius:10px;min-width:0;min-height:70px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#fff;font:inherit;cursor:pointer;padding:8px 2px}.recent-result.W{background:#168653}.recent-result.L{background:#C63C50}.recent-result.D{background:#64748B}.recent-result strong{font-size:21px;line-height:1.1}.recent-result span{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}.recent-result small{font-size:10px}.recent-result:active{opacity:.8}

.rotation-grid{overflow-x:auto;border:1px solid #34495e;border-radius:12px;background:var(--surface);margin-top:6px}.rotation-grid table{width:100%;border-collapse:collapse}.rotation-grid th{font-size:12px;color:#e6c47e;padding:10px 5px;text-align:center;background:rgba(217,179,101,.07)}.rotation-grid th:first-child{text-align:left;padding-left:12px}.rotation-grid td{padding:7px 5px;text-align:center}.rotation-grid td:first-child{text-align:left;padding-left:12px;font-weight:500;white-space:nowrap}.rotation-mark{display:inline-flex;align-items:center;justify-content:center;width:28px;height:26px;border-radius:7px;font-weight:700;font-size:14px}.rotation-mark.playing{background:rgba(75,190,132,.15);color:#83d9a4}.rotation-mark.partial{background:rgba(217,179,101,.15);color:#e6c47e}.rotation-mark.resting{color:var(--muted);background:rgba(130,150,175,.07)}.rotation-legend{display:flex;flex-wrap:wrap;gap:12px;font-size:11px;color:var(--muted);padding:8px 2px}.rotation-tabs{display:flex;gap:6px;margin:4px 0 10px}.rotation-tabs button{flex:1;min-height:42px;border-radius:9px}.rotation-tabs button.on{background:#d9b365;color:#102034;border-color:#d9b365;font-weight:700}.rotation-tabs button:disabled{opacity:.45}.rotation-hint{font-size:13px;color:var(--muted);margin:0 0 8px}.rotation-bench-title{margin:8px 0 2px}
</style>
<style>
.formation-editor-pitch{position:relative;display:block;width:100%;height:480px;min-height:480px;flex:none;background:repeating-linear-gradient(to bottom,#28884e 0%,#28884e 16.66%,#237b46 16.66%,#237b46 33.33%);border:4px solid #d4e7d9;border-radius:14px;overflow:hidden;touch-action:none;margin:8px 0}
.formation-pitch-line{position:absolute;left:4%;right:4%;top:50%;border-top:2px solid #ffffffa0}
.formation-pitch-circle{position:absolute;left:35%;width:30%;top:38%;height:24%;border:2px solid #ffffffa0;border-radius:50%}
.formation-pitch-box{position:absolute;left:23%;width:54%;bottom:0;height:18%;border:2px solid #ffffffa0}
.formation-edit-token{position:absolute;transform:translate(-50%,-50%);width:52px;height:52px;border-radius:50%;border:3px solid var(--team-accent,#ff2e93);background:#1b2a4e;color:#fff;font-weight:800;font-size:14px;touch-action:none;user-select:none;z-index:2;box-shadow:0 3px 8px #0005}
.formation-edit-token.keeper{background:#ff2e93;color:#fff}.formation-edit-token.selected{outline:4px solid #fff;outline-offset:3px;box-shadow:0 0 0 6px #ff2e93,0 4px 12px #0008}
.formation-role-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
</style>
<style id="design-d04">
.sheet.sheet-v2{max-height: min(92dvh,calc(100dvh - env(safe-area-inset-top,0px) - 12px));padding-top:0;gap:12px;overscroll-behavior:contain}
.sheet-header{position:sticky;top:0;z-index:10;background:var(--surface);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 0 12px;border-bottom:1px solid rgba(120,130,150,.22)}
.sheet-header h2{margin:0;flex:1;min-width:0;font-size:clamp(19px,5vw,25px);line-height:1.15}
.sheet-header .sheet-close{flex-shrink:0;min-height:44px}
.sheet-v2>*{flex-shrink:0}
</style>
<style id="design-d05">
.home-v2{gap:14px}.home-hero{background:var(--team-1,#192749);color:var(--team-ink,#fff);border-radius:16px;padding:20px 18px;border-bottom:4px solid var(--team-2,#ff278c)}.home-hero h2{font-size:30px;line-height:1.1;margin:8px 0}.home-hero .eyebrow,.home-hero .small{color:inherit;opacity:.8}.home-next .li{background:var(--surface-2);border-radius:12px;padding:16px 12px}.home-next .li b{font-size:19px}.home-form .form{display:flex;gap:8px}.home-form .form .pill{flex:1;max-width:64px;min-height:40px;border-radius:9px;font-weight:700}.home-tasks .li{border-bottom:1px solid rgba(120,130,150,.15)}.home-honours{width:100%;text-align:left;color:inherit;gap:12px}.home-honours .main{flex:1}.home-trophy{font-size:25px}
</style><style id="design-d06">
.md{top:env(safe-area-inset-top,0px);padding-top:0}
.score-v2 .wrap{gap:8px;padding-top:8px;padding-bottom:10px}
.score-v2 .sline{margin:4px 0;gap:8px}.score-v2 .sline .g{font-size:clamp(38px,11vw,58px);line-height:1}.score-v2 .sline .t{font-size:clamp(12px,3.5vw,18px);line-height:1.15}
.score-v2 .clock{margin:2px 0;gap:8px}.score-v2 .clock .tm{font-size:36px;line-height:1}.score-v2 .ctl{margin-top:4px}.score-v2 .ctl .btn{min-height:44px;padding:8px}
.match-more{position:relative}.match-more summary{list-style:none;cursor:pointer;min-width:44px;min-height:44px;display:grid;place-items:center;border:1px solid #ffffff55;border-radius:10px}.match-more summary::-webkit-details-marker{display:none}.match-more button{position:absolute;right:0;top:48px;z-index:5;white-space:nowrap;background:var(--surface);color:var(--fg)}
.md .quick{grid-template-columns:repeat(5,minmax(0,1fr));gap:5px}.md .quick .btn{font-size:11px;padding:6px 2px;min-height:52px;min-width:0}.md .quick strong{font-size:18px;line-height:1.1}
</style></head>
<body>
<style>
/* Layout: phone-first single column, sticky team bar on top, tab bar on the bottom, full-screen matchday overlay */
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --surface-2:#E9EDF3; --fg:#141B2B; --muted:#5D6880; --line:#D6DCE6;
  --grass:#2F8F4E; --grass-2:#2A8247; --chalk:rgba(255,255,255,.75);
  --good:#1E8E4F; --warn:#C27A00; --bad:#C9353C; --info:#2F6FD6;
  --team:#1B2A4E; --team-2:#FF2E93; --team-ink:#FFFFFF;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E131D; --surface:#171E2B; --surface-2:#212A3A; --fg:#E8ECF3; --muted:#98A3B8; --line:#2C3648;
  --grass:#24703D; --grass-2:#206536; --chalk:rgba(255,255,255,.6);
  --good:#3CC27A; --warn:#E9A83A; --bad:#F06A6F; --info:#6EA0F5; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0E131D; --surface:#171E2B; --surface-2:#212A3A; --fg:#E8ECF3; --muted:#98A3B8; --line:#2C3648;
  --grass:#24703D; --grass-2:#206536; --chalk:rgba(255,255,255,.6);
  --good:#3CC27A; --warn:#E9A83A; --bad:#F06A6F; --info:#6EA0F5; color-scheme:dark }
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--team)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--team-2);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance;line-height:1.1}
h2{font-size:24px} h3{font-size:19px}
.num{font-variant-numeric:tabular-nums}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:760px;margin:0 auto}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--team);color:var(--team-ink);border-bottom:4px solid var(--team-2)}
.bar .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.badge{width:40px;height:40px;border-radius:50%;background:var(--team-2);color:var(--team);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:17px;flex:none;overflow:hidden;border:2px solid var(--team-ink)}
.badge img{width:100%;height:100%;object-fit:cover}
.bar .tname{font-family:var(--f-display);font-size:22px;font-weight:800;line-height:1;text-transform:uppercase;letter-spacing:.02em}
.bar .brand{font-size:11px;letter-spacing:.14em;text-transform:uppercase;opacity:.75;margin-top:3px}
.bar .grow{flex:1;min-width:0}
.applogo{width:40px;height:40px;border-radius:10px;flex:none;display:block}
.brandfoot{display:flex;align-items:center;gap:12px;justify-content:center;padding-top:6px;color:var(--muted)}
.brandfoot img{width:44px;height:44px;border-radius:11px}
.brandfoot b{display:block;font-family:var(--f-display);font-size:20px;color:var(--fg);letter-spacing:.02em}
.brandfoot span{font-size:11px;letter-spacing:.12em;text-transform:uppercase}

main{padding-block:16px 110px}
.stack{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.card.flat{background:transparent;border:0;padding:0}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{justify-content:space-between}
.muted{color:var(--muted)}
.small{font-size:13px}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;font-weight:600;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{background:var(--team);color:var(--team-ink);border-color:var(--team)}
.btn.accent{background:var(--team-2);color:#fff;border-color:var(--team-2)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad);background:transparent}
.btn.big{min-height:56px;font-size:17px;width:100%}
.btn.sm{min-height:34px;padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:default}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.W{background:var(--good);color:#fff}.pill.D{background:var(--muted);color:var(--surface)}.pill.L{background:var(--bad);color:#fff}
.pill.ex{background:transparent;border:1px dashed var(--muted)}
.pill.over{background:var(--warn);color:#fff}.pill.under{background:var(--info);color:#fff}
.pos{font-size:11px;font-weight:700;padding:2px 6px;border-radius:5px;background:var(--surface-2);color:var(--fg)}
.pos.p1{background:var(--team);color:var(--team-ink)}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.li:last-child{border-bottom:0}
.shirt{width:34px;height:34px;flex:none;border-radius:8px;background:var(--team);color:var(--team-ink);font-family:var(--f-display);font-weight:800;font-size:18px;display:grid;place-items:center}
.li .main{flex:1;min-width:0}
.li .title{font-weight:600}
.notice{border:1px dashed var(--muted);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--muted);display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--muted)}
.input,select.input,textarea.input{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;min-height:44px;width:100%;color:var(--fg);font-weight:500}
textarea.input{min-height:120px;font-family:ui-monospace,Menlo,monospace;font-size:12.5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.seg{display:flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:8px;padding:8px 6px;font-weight:600;font-size:13px;color:var(--muted);min-height:36px}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .wrap{display:grid;grid-template-columns:repeat(5,1fr)}
.tabs button{border:0;background:none;padding:9px 0 8px;font-size:11.5px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;min-height:56px}
.tabs button.on{color:var(--fg)}
.tabs button.on svg{color:var(--team-2)}
.tabs svg{width:22px;height:22px}

/* pitch */
.pitch{position:relative;width:100%;max-width:440px;margin:0 auto;aspect-ratio:68/80;border-radius:10px;overflow:hidden;
  background:repeating-linear-gradient(180deg,var(--grass) 0 10%,var(--grass-2) 10% 20%);border:2px solid var(--chalk)}
.pitch .ln{position:absolute;border:2px solid var(--chalk);pointer-events:none}
.pitch .half{left:-2px;right:-2px;top:-2px;height:4%;border-top:0}
.pitch .box{left:22%;right:22%;bottom:-2px;height:17%;border-bottom:0}
.pitch .six{left:36%;right:36%;bottom:-2px;height:6%;border-bottom:0}
.pitch .arc{left:38%;right:38%;top:-9%;aspect-ratio:1;border-radius:50%}
.tok{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px;width:78px;border:0;background:none;padding:0;color:#fff}
.tok .dot{width:40px;height:40px;border-radius:50%;background:var(--team);border:2px solid var(--team-2);color:var(--team-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:18px;box-shadow:0 2px 4px rgba(0,0,0,.3)}
.tok.gk .dot{background:var(--team-2);border-color:var(--team);color:#fff}
.tok .nm{font-size:11.5px;font-weight:700;background:rgba(0,0,0,.55);padding:1px 6px;border-radius:5px;max-width:78px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tok .sub{font-size:10px;font-weight:700;opacity:.9;background:rgba(0,0,0,.35);padding:0 5px;border-radius:4px}
.tok.empty .dot{background:rgba(255,255,255,.15);border-style:dashed;border-color:#fff;color:#fff}
.tok.sel .dot{outline:3px solid #FFE14D;outline-offset:2px}
.tok.chg .dot{box-shadow:0 0 0 3px #FFE14D}
.tok.ovr .sub{background:var(--warn)}.tok.und .sub{background:var(--info)}
.bench{display:flex;gap:8px;flex-wrap:wrap}
.bchip{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 10px;display:flex;align-items:center;gap:8px;min-height:44px}
.bchip .shirt{width:28px;height:28px;font-size:15px}
.bchip.sel{outline:3px solid var(--team-2)}
.bchip .m{font-size:11px;color:var(--muted)}
.btabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.btabs button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-weight:700;font-size:13px;min-height:36px}
.btabs button.on{background:var(--team);color:var(--team-ink);border-color:var(--team)}
.btabs button .lk{font-size:10px;margin-left:4px;opacity:.8}

/* minutes bars */
.mtab{width:100%;border-collapse:collapse;font-size:13px}
.mtab td,.mtab th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.mtab th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.barw{position:relative;height:10px;background:var(--surface-2);border-radius:5px;min-width:60px}
.barw i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--team-2)}
.barw b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--fg);opacity:.6}
.dots{display:flex;gap:3px}
.dots span{width:10px;height:10px;border-radius:3px;background:var(--surface-2)}
.dots span.on{background:var(--team)}
.dots span.gk{background:var(--team-2)}
.scroll-x{overflow-x:auto}

/* matchday */
.md{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
.score{background:var(--team);color:var(--team-ink);border-bottom:4px solid var(--team-2)}
.score .wrap{padding-block:10px 12px;display:flex;flex-direction:column;gap:8px}
.sline{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}
.sline .t{font-family:var(--f-display);font-weight:700;font-size:17px;text-transform:uppercase;line-height:1.05;overflow:hidden;text-overflow:ellipsis}
.sline .t.r{text-align:right}
.sline .g{font-family:var(--f-display);font-weight:800;font-size:48px;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.clock{display:flex;align-items:center;justify-content:center;gap:10px;font-family:var(--f-display);font-weight:800;font-variant-numeric:tabular-nums}
.clock .per{font-size:18px;background:var(--team-2);color:#fff;padding:2px 8px;border-radius:6px}
.clock .tm{font-size:40px;line-height:1}
.clock .tm.late{color:#FFD24D}
.ctl{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ctl .btn{border-color:rgba(255,255,255,.35);background:rgba(255,255,255,.1);color:var(--team-ink);min-height:52px;font-size:16px}
.ctl .btn.go{background:var(--team-2);border-color:var(--team-2);color:#fff}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.quick .btn{min-height:58px;flex-direction:column;gap:2px;font-size:13px;padding:6px}
.quick .btn strong{font-family:var(--f-display);font-size:20px;line-height:1}
.alertpop{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--team-2);color:#fff;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px;box-shadow:0 -6px 24px rgba(0,0,0,.3);animation:pop .25s ease-out}
.alertpop .at{font-family:var(--f-display);font-weight:800;font-size:28px;line-height:1.05;text-transform:uppercase}
.alertpop .btn{flex:1;background:#fff;color:#111;border:0;min-height:52px;font-size:16px}
@keyframes pop{from{transform:translateY(100%)}to{transform:none}}
.tgl{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-weight:600}
.tgl input[type=checkbox]{width:24px;height:24px;accent-color:var(--team-2)}
.selbar{border:2px solid var(--team-2);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;font-size:14px;background:var(--surface)}
.alert{border-radius:10px;padding:10px 12px;font-weight:600;background:var(--warn);color:#fff;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.subrow{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.subrow:last-child{border-bottom:0}
.on-a{color:var(--good);font-weight:700}.off-a{color:var(--bad);font-weight:700}
.ev{display:flex;gap:10px;font-size:13px;padding:5px 0;border-bottom:1px solid var(--line)}
.ev:last-child{border-bottom:0}
.ev .tm{width:52px;color:var(--muted);flex:none}

/* sheet */
.scrim{position:fixed;inset:0;z-index:60;background:rgba(5,10,20,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:760px;max-height:88vh;overflow-y:auto;border-radius:16px 16px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.pick .btn{justify-content:flex-start;text-align:left}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(76px + env(safe-area-inset-top,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:80;font-size:14px;max-width:90vw}
.stat-n{font-family:var(--f-display);font-size:30px;font-weight:800;line-height:1}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.kpis>div{background:var(--surface-2);border-radius:10px;padding:10px 4px}
.form{display:flex;gap:4px}
.fx{display:flex;gap:12px;align-items:center}
.fx .date{width:48px;text-align:center;flex:none;font-family:var(--f-display);line-height:1}
.fx .date b{display:block;font-size:24px}
.fx .date span{font-size:12px;text-transform:uppercase;color:var(--muted);font-weight:700}
.swatch{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);padding:0;overflow:hidden}
.swatch input{width:64px;height:64px;margin:-10px;border:0;padding:0;background:none}
.fav{border:0;background:none;font-size:18px;color:var(--muted);padding:4px;min-width:32px}
.fav.on{color:var(--team-2)}
.fcard{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 6px 6px 10px;white-space:nowrap;display:flex;align-items:center;justify-content:space-between;gap:6px;min-height:44px;font-weight:700;font-family:var(--f-display);font-size:19px}
.fcard.on{border-color:var(--team);box-shadow:inset 0 0 0 2px var(--team)}
@media (max-width:380px){.quick{grid-template-columns:repeat(2,1fr)}.kpis{grid-template-columns:repeat(2,1fr)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

c(v)+'" '+((h.competition||"")===v?'selected':'')+'>'+esc(v||'Not specified')+'</option>').join('')+'</select></label><div class="grid2"><button class="btn" data-a="closeSheet">Cancel</button><button class="btn primary" data-a="saveHonour">Save</button></div>'+(q.hid?'<button class="btn danger" data-a="deleteHonour">Remove award</button>':'');}
function sheetPlayer(id){

  const st=id?computeStats({}).players.find(r=>r.p.id===id):null;
  const history=id?fixtures().filter(f=>f.status==='played'&&!f.imported&&(f.scorers||[]).some(g=>g.pid===id)).sort((a,b)=>b.date.localeCompare(a.date)):[];
  const bySeason={...(p.historicalGoalsBySeason||{})};history.forEach(f=>{const k=fixtureSeason(f);bySeason[k]=(bySeason[k]||0)+(f.scorers||[]).filter(g=>g.pid===id).length;});

   <label class="f">1st position${sel(0)}</label><label class="f">2nd position${sel(1)}</label><label class="f">3rd position${sel(2)}</label><label class="f">4th position${sel(3)}</label><label class="f">5th position${sel(4)}</label>
   <div class="card stack"><b>Player history</b><p class="small muted">Set when the player joined and, for former players, their final season. Leave blank if unknown.</p><div class="grid2"><label class="f">Starting season<select class="input" id="pStartSeason"><option value="">Unknown</option>${[...new Set([...seasonOptions(new Date().toISOString().slice(0,10)),p.startSeason].filter(Boolean))].sort().map(y=>'<option value="'+esc(y)+'" '+(p.startSeason===y?'selected':'')+'>'+esc(seasonLabel(y))+'</option>').join('')}</select></label><label class="f">Leaving season<select class="input" id="pLeavingSeason"><option value="">Still with team / unknown</option>${[...new Set([...seasonOptions(new Date().toISOString().slice(0,10)),p.leavingSeason].filter(Boolean))].sort().map(y=>'<option value="'+esc(y)+'" '+(p.leavingSeason===y?'selected':'')+'>'+esc(seasonLabel(y))+'</option>').join('')}</select></label></div></div>
   <label class="f">Notes<input class="input" id="pNotes" value="${esc(p.notes||'')}" placeholder="e.g. quick, left-footed"></label>
   <div class="card stack"><b>Player photo</b>${p.photo?'<img src="'+p.photo+'" alt="Player photo" style="width:100px;height:100px;object-fit:cover;border-radius:50%">':''}<input type="file" id="playerPhotoFile" accept="image/*" aria-label="Upload player photo"><span class="small muted">Photo stays in this device's app data and backups.</span></div>
   <div class="card stack"><b>Opening career totals</b><p class="small muted">Enter confirmed totals from before tracking new games. New match stats add automatically.</p><div class="grid2">${[['apps','Appearances'],['goals','Goals'],['assists','Assists'],['motm','MOTM']].map(([k,l])=>'<label class="f">'+l+'<input class="input" type="number" min="0" id="opening_'+k+'" value="'+(p.openingStats?.[k]??0)+'"></label>').join('')}</div></div>
   <div class="card stack"><b>Historical appearances by season</b><p class="small muted">Enter appearances from before fixture tracking. These add to future recorded appearances without double-counting.</p><div class="grid2" data-history-grid="apps-season">${playerHistoricalSeasons(p).map(y=>'<label class="f">'+esc(seasonLabel(y))+'<input class="input" type="number" min="0" data-apps-season="'+esc(y)+'" value="'+(p.historicalAppsBySeason?.[y]||0)+'"></label>').join('')}</div><label class="f">Unallocated historical appearances<input class="input" type="number" min="0" id="apps_unallocated" value="${p.historicalUnallocatedApps??Math.max(0,(p.openingStats?.apps||0)-Object.values(p.historicalAppsBySeason||{}).reduce((a,b)=>a+(+b||0),0))}"></label></div>
   <div class="card stack"><b>Historical goals by season</b><p class="small muted">Allocate past goals by season. Unallocated goals still count towards career totals.</p><div class="grid2" data-history-grid="historical-season">${playerHistoricalSeasons(p).map(y=>'<label class="f">'+esc(seasonLabel(y))+'<input class="input" type="number" min="0" data-historical-season="'+esc(y)+'" value="'+(p.historicalGoalsBySeason?.[y]||0)+'"></label>').join('')}</div><label class="f">Unallocated historical goals<input class="input" type="number" min="0" id="opening_unallocated" value="${p.historicalUnallocatedGoals??Math.max(0,(p.openingStats?.goals||0)-Object.values(p.historicalGoalsBySeason||{}).reduce((a,b)=>a+(+b||0),0))}"></label></div>
   <div class="card stack"><b>Historical MOTM by season</b><p class="small muted">Allocate existing MOTM awards to seasons. New fixture MOTM awards are added automatically.</p><div class="grid2" data-history-grid="motm-season">${playerHistoricalSeasons(p).map(y=>'<label class="f">'+esc(seasonLabel(y))+'<input class="input" type="number" min="0" data-motm-season="'+esc(y)+'" value="'+(p.historicalMotmBySeason?.[y]||0)+'"></label>').join('')}</div><label class="f">Unallocated historical MOTM<input class="input" type="number" min="0" id="motm_unallocated" value="${p.historicalUnallocatedMotm??Math.max(0,(p.openingStats?.motm||0)-Object.values(p.historicalMotmBySeason||{}).reduce((a,b)=>a+(+b||0),0))}"></label></div>

}

/* ---------- Fixtures ---------- */
function fxRow(f){
  const d=new Date(f.date+'T12:00:00'); const r=result(f);
  return `<button class="li fx" data-a="openFx" data-id="${f.id}"><div class="date"><b class="num">${d.getDate()}</b><span>${d.toLocaleDateString('en-GB',{month:'short'})}</span></div>
    <div class="main"><div class="title">${f.homeAway==='A'?'@ ':''}${esc(f.opponent)}</div><div class="small muted">${esc(f.competition||'')} · ${esc(seasonLabel(fixtureSeason(f)))} · ${f.format}v${f.format}${f.pitch?' · '+esc(f.pitch):''}${f.sample?' · example':''}${f.match&&!f.match.ended?' · <b style="color:var(--team-2)">live</b>':''}</div></div>
    ${f.score?`<span class="pill ${r} num">${esc(matchScoreLabel(f))}</span>`:'<span class="muted">›</span>'}</button>`;
}
function vFixtures(){
 const today=new Date().toISOString().slice(0,10);
 const fxs=fixtures();
 const up=fxs.filter(f=>f.status!=='played'&&f.date>=today).map(f=>({...f,eventType:'match'}));
 const training=(team().trainingSessions||[]).map(x=>({...x,eventType:'training'}));
 const events=(team().scheduleEvents||[]).map(x=>({...x,eventType:'event'}));
 const upcoming=[...up,...training.filter(x=>x.date>=today),...events.filter(x=>x.date>=today)].sort((a,b)=>a.date.localeCompare(b.date));
 const done=fxs.filter(f=>f.status==='played').sort((a,b)=>b.date.localeCompare(a.date));
 const pastTraining=training.filter(x=>x.date<today).sort((a,b)=>b.date.localeCompare(a.date));
 const tab=ui.scheduleTab||'upcoming', expanded=!!ui.scheduleExpanded;
 const eventRow=x=>x.eventType==='event'?'<button class="li" data-a="editEvent" data-id="'+x.id+'"><span class="main"><b>'+esc(x.title||'Team event')+'</b><div class="small muted">'+esc(fmtDate(x.date))+' · '+esc(x.time||'')+' · '+esc(x.venue||'')+'</div></span><span>Details ›</span></button>':x.eventType==='training'?'<button class="li" data-a="editTraining" data-id="'+x.id+'"><span class="main"><b>Training</b><div class="small muted">'+esc(fmtDate(x.date))+' · '+(x.confirmed?'Register confirmed · '+(x.present?.length||0)+' present':'Attendance not confirmed')+'</div></span><span>Attendance ›</span></button>':fxRow(x);
 const history=[...done.map(x=>({...x,eventType:'match'})),...pastTraining,...events.filter(x=>x.date<today)].sort((a,b)=>b.date.localeCompare(a.date));
 const historyFiltered=history.filter(x=>(!ui.scheduleSeason||season(x.date)===ui.scheduleSeason)&&(!ui.scheduleType||x.eventType===ui.scheduleType));
 const years=[...new Set(history.map(x=>season(x.date)))].sort().reverse();
 const visible=tab==='history'?historyFiltered:upcoming;
 return `<div class="stack">
 <div class="row between"><h2>Schedule</h2><div class="row"><button class="btn primary sm" data-a="addFx">+ Match</button><button class="btn sm" data-a="newTraining">+ Training</button><button class="btn sm" data-a="newEvent">+ Event</button></div></div>
 <div class="seg" style="display:grid;grid-template-columns:repeat(2,1fr)" role="group" aria-label="Schedule view">
 <button data-a="scheduleTab" data-v="upcoming" class="${tab==='upcoming'?'on':''}">Upcoming</button>
 <button data-a="scheduleTab" data-v="history" class="${tab==='history'?'on':''}">History</button></div>
 
 ${tab==='history'?'<div class="grid2"><select class="input" data-a="scheduleFilter" data-k="season"><option value="">All seasons</option>'+years.map(y=>'<option value="'+esc(y)+'" '+(ui.scheduleSeason===y?'selected':'')+'>'+esc(seasonLabel(y))+'</option>').join('')+'</select><select class="input" data-a="scheduleFilter" data-k="type"><option value="">All activities</option><option value="match" '+(ui.scheduleType==='match'?'selected':'')+'>Matches</option><option value="training" '+(ui.scheduleType==='training'?'selected':'')+'>Training</option><option value="event" '+(ui.scheduleType==='event'?'selected':'')+'>Team events</option></select></div>':''}
 <div class="card stack"><div class="eyebrow">${tab==='history'?'Completed activities':'Next activities'} · ${visible.length}</div><div class="list">${visible.slice(0,expanded?undefined:5).map(eventRow).join('')||'<p class="small muted">Nothing to show.</p>'}</div>
 ${visible.length>5?'<button class="btn" data-a="scheduleExpand">'+(expanded?'Show less':'View all ('+visible.length+')')+'</button>':''}</div>
 <div class="grid2"><button class="btn" data-a="nav" data-v="opponents">Manage opponents</button><button class="btn" data-a="nav" data-v="history">Match audit</button></div>
 <div class="card stack"><div class="row between"><div class="eyebrow">Attendance</div><button class="btn sm" data-a="toggleScheduleAttendance">${ui.showScheduleAttendance?'Hide':'Show'}</button></div>${ui.showScheduleAttendance?vScheduleAttendance():'<p class="small muted">Training and match attendance by season.</p>'}</div>
 </div>`;
}
function vScheduleAttendance(){
 const sessions=team().trainingSessions||[];
 const years=[...new Set([...sessions.map(x=>season(x.date)),...squad().flatMap(p=>Object.keys(p.historicalAttendance||{})),...fixtures().filter(f=>f.status==='played').map(f=>fixtureSeason(f))])].sort().reverse();
 const y=ui.attendanceSeason||years[0]||season(new Date().toISOString().slice(0,10));
 const mode=ui.attendanceMode||'training';
 return `<div class="card stack"><div class="row between"><div class="eyebrow">Attendance overview</div><button class="btn sm primary" data-a="newTraining">+ Session</button></div>
 <select class="input" data-a="attendanceSeason"><option value="">All seasons</option>${years.map(x=>'<option value="'+esc(x)+'" '+(y===x?'selected':'')+'>'+esc(seasonLabel(x))+'</option>').join('')}</select>
 <div class="seg" style="display:grid;grid-template-columns:1fr 1fr"><button data-a="attendanceMode" data-v="training" class="${mode==='training'?'on':''}">Training</button><button data-a="attendanceMode" data-v="match" class="${mode==='match'?'on':''}">Matches</button></div>
 <div class="list">${squad().map(p=>{if(mode==='training'){const a=trainingAttendance(p,y);return '<div class="li"><span class="main">'+esc(p.name)+'</span><b>'+a.present+' / '+a.total+(a.total?' · '+Math.round(a.present/a.total*100)+'%':'')+' · '+a.absent+' absent · '+a.injured+' injured · '+a.excused+' excused'+'</b></div>';}const rr=attendanceRows(p.id).filter(x=>fixtureSeason(x.f)===y),played=rr.filter(x=>x.status==='Played').length;return '<div class="li"><span class="main">'+esc(p.name)+'</span><b>'+played+' played · '+(rr.length-played)+' other</b></div>';}).join('')}</div>
 <p class="small muted">Historical training totals can be edited from each player profile. Imported matches without tracked attendance are excluded.</p></div>`;
}
function quarterTime(id,value){const times=Array.from({length:96},(_,i)=>String(Math.floor(i/4)).padStart(2,'0')+':'+String(i%4*15).padStart(2,'0'));if(value&&!times.includes(value))times.push(value);times.sort();return '<select class="input" id="'+id+'">'+times.map(t=>'<option value="'+esc(t)+'" '+(t===value?'selected':'')+'>'+esc(t)+'</option>').join('')+'</select>';}
function meetBefore(time){const [h,m]=(time||'10:30').split(':').map(Number),n=(h*60+m+1410)%1440;return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0');}

   <div class="grid2"><label class="f">Home / away<select class="input" id="fHA"><option value="H" ${f.homeAway==='H'?'selected':''}>Home</option><option value="A" ${f.homeAway==='A'?'selected':''}>Away</option><option value="N" ${f.homeAway==='N'?'selected':''}>Neutral</option></select></label><label class="f">Competition<input class="input" id="fComp" value="${esc(f.competition)}" list="compList"></label></div>
   <datalist id="compList">${[...new Set(['League','Cup','Friendly','Tournament',...fixtures().map(x=>x.competition).filter(Boolean)])].map(o=>`<option value="${esc(o)}">`).join('')}</datalist>
   <div class="grid2"><label class="f">Venue<input class="input" id="fVenue" value="${esc(f.venue)}"></label><label class="f">Pitch type<select class="input" id="fPitch"><option value="">Not set</option>${PITCHES.map(x=>`<option ${f.pitch===x?'selected':''}>${x}</option>`).join('')}</select></label></div>

   <div class="grid3"><label class="f">Format<select class="input" id="fFmt">${FORMATS.map(n=>`<option value="${n}" ${f.format===n?'selected':''}>${n}v${n}</option>`).join('')}</select></label>
     <label class="f">Periods<select class="input" id="fPer">${[1,2,3,4].map(n=>`<option value="${n}" ${f.periods===n?'selected':''}>${n===1?'1':n===2?'2 halves':n===4?'4 quarters':n+' thirds'}</option>`).join('')}</select></label>
     <label class="f">Minutes each<input class="input num" type="number" inputmode="numeric" id="fMins" value="${f.periodMins}"></label></div>
   <div class="card stack"><b>Cup tie rules</b><p class="small muted">Enable extra time and/or penalties if this fixture may need them. Record the actual results afterwards using Edit score.</p><label class="f"><input type="checkbox" id="fAllowET" ${f.allowExtraTime?'checked':''}> Extra time possible</label><label class="f"><input type="checkbox" id="fAllowPens" ${f.allowPenalties?'checked':''}> Penalty shootout possible</label></div>

function trendSvg(fxs){
  const W=320,H=90,pad=18, n=fxs.length, max=Math.max(3,...fxs.map(f=>Math.abs(f.score.us-f.score.them)));
  const bw=(W-pad*2)/n; const mid=H/2;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Goal difference in recent matches" style="max-width:100%">
   <line x1="${pad}" x2="${W-pad}" y1="${mid}" y2="${mid}" stroke="var(--line)" stroke-width="1"/>
   ${fxs.map((f,i)=>{const d=f.score.us-f.score.them, h=Math.abs(d)/max*(mid-10), x=pad+i*bw+bw*0.2; const y=d>=0?mid-h:mid;
     return `<rect x="${x}" y="${y}" width="${bw*0.6}" height="${Math.max(h,2)}" rx="2" fill="${d>0?'var(--good)':d<0?'var(--bad)':'var(--muted)'}"><title>${esc(f.opponent)} ${f.score.us}-${f.score.them}</title></rect>`}).join('')}
  </svg>`;
}

function tacticalPitch(ours,theirs,lineup,opponent,ourName,live=null){
 const q=live?.state||ui.sheet,key=JSON.stringify([ours,theirs]);if(q.boardKey!==key){q.boardKey=key;q.board=null;}if(!q.board){q.board=[];for(const [away,slots] of [[false,ours],[true,theirs]])slots.forEach((p,i)=>{let x=i===0?160:18+(away?100-p.x:p.x)*2.84,y=i===0?(away?40:380):(away?210+(45-p.y)*3.25:210+(p.y-45)*3.25);y=i===0?y:Math.max(78,Math.min(342,y));const ok=(a,b)=>a>=24&&a<=296&&b>=(i===0?24:78)&&b<=(i===0?396:342)&&q.board.every(v=>Math.hypot(v.x-a,v.y-b)>=35);if(!ok(x,y)){search:for(let d=8;d<=450;d+=8)for(let j=0;j<32;j++){const a=x+d*Math.cos(j*Math.PI/16),b=y+d*Math.sin(j*Math.PI/16);if(ok(a,b)){x=a;y=b;break search;}}}q.board.push({x,y,away,i});});}
 const marker=(p,i,away)=>{const v=q.board.find(v=>v.away===away&&v.i===i),x=v.x,y=v.y;const who=!away&&lineup?.[i]?player(lineup[i]):null;const label=who?.number??(away?i+1:p.code||i+1);return '<g data-board-marker="'+(away?'a':'h')+i+'" '+(live&&!away&&!q.boardEdit?'data-a="slot" data-j="'+i+'"':'')+' style="touch-action:'+(q.boardEdit?'none':'auto')+'"><circle cx="'+x+'" cy="'+y+'" r="12" fill="'+(away?(i===0?'#ffe5a8':'#fff'):(i===0?'#48658e':'#192749'))+'" stroke="'+(away?'#dc3545':'#ff278c')+'" stroke-width="'+(live&&!away&&ui.sel?.t==='slot'&&ui.sel.j===i?5:2.5)+'"/><text x="'+x+'" y="'+(y+3.5)+'" text-anchor="middle" font-size="9" font-weight="700" fill="'+(away?'#a51d2d':'#fff')+'">'+esc(String(label))+'</text>'+(live&&who?'<text x="'+x+'" y="'+(y+23)+'" text-anchor="middle" font-size="9" font-weight="700" fill="white" stroke="#164d2a" stroke-width="2" paint-order="stroke">'+esc(firstName(who))+'</text><text x="'+x+'" y="'+(y+33)+'" text-anchor="middle" font-size="8" fill="white" data-min="'+who.id+'">'+esc(live.minutes(who.id))+'</text>':'')+'</g>';};
 return `<div class="card stack" style="padding:10px;flex-shrink:0"><div class="small" style="text-align:center"><b>${esc(opponent)}</b> · attacks down ↓</div><div class="row"><button class="btn sm ${q.boardEdit?'primary':''}" data-a="boardEdit">${q.boardEdit?'Finish editing':'Edit positions'}</button><button class="btn sm" data-a="boardReset">Reset positions</button></div><svg id="${live?'liveTacticalBoard':'tacticalBoard'}" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 420" width="320" height="420" role="img" aria-label="Both teams on the same football pitch" style="display:block;width:100%;height:auto;aspect-ratio:320/420;max-height:none;flex-shrink:0;background:#287c43;border-radius:10px">${Array.from({length:8},(_,i)=>'<rect x="10" y="'+(10+i*50)+'" width="300" height="50" fill="'+(i%2?'#287c43':'#308b4a')+'"/>').join('')}<g fill="none" stroke="#fff" opacity=".7" stroke-width="1.5"><rect x="10" y="10" width="300" height="400"/><path d="M10 210H310 M85 10V65H235V10 M85 410V355H235V410 M125 10V30H195V10 M125 410V390H195V410"/><circle cx="160" cy="210" r="38"/></g>${theirs.map((p,i)=>marker(p,i,true)).join('')}${ours.map((p,i)=>marker(p,i,false)).join('')}</svg><div class="small" style="text-align:center"><b>${esc(ourName)}</b> · attacks up ↑</div><div class="row" style="justify-content:center;flex-wrap:wrap;gap:12px"><span class="small"><span style="color:#ff278c">●</span> Our players (${ours.length})</span><span class="small"><span style="color:#dc3545">○</span> Opposition (${theirs.length})</span></div><div class="small muted">Opposition numbers are illustrative, not actual shirt numbers.</div></div>`;
}

function tacticalAdvice(ours,theirs,tags){const a=ours?.slots?.filter(p=>p.code!=='GK')||[],b=theirs;const def=a.filter(p=>p.y>=58).length,att=a.filter(p=>p.y<=30).length;let strengths=[],risks=[],tips=[];if(def>b[b.length-1]){strengths.push('Potential spare defender against their front line.');tips.push('Use the spare defender to support build-up while keeping cover.');}else if(def<=b[b.length-1])risks.push('Their front line may match or outnumber our deepest defenders.');if(att<b[0]){risks.push('Our forwards may be outnumbered by their defenders.');tips.push('Encourage midfield support and movement into wide spaces.');}else if(att>b[0])strengths.push('Potential attacking overload against their back line.');const mid=a.length-def-att,oppMid=b.slice(1,-1).reduce((x,y)=>x+y,0);if(mid>oppMid)strengths.push('Potential midfield numerical advantage.');if(mid<oppMid)risks.push('Possible midfield overload against us.');tips.push(...tags.map(t=>tacticalTags[t]).filter(Boolean));return [['Potential strengths',strengths],['Potential weaknesses',risks],['Coaching tips',tips]].map(([k,v])=>'<div><b>'+k+'</b>'+ (v.length?v.map(t=>'<div class="small">• '+esc(t)+'</div>').join(''):'<div class="small muted">No clear numerical advantage from formation alone.</div>')+'</div>').join('');}
function oppLibrary(f){return (db.oppositionFormations||[]).filter(x=>x.teamId===team().id&&+x.format===+f.format);}
function tacticalOptions(f){const names=[...FORMATIONS.filter(x=>x.format===+f.format).map(x=>x.name),...( +f.format===9?['2-1-3-2']:[])];return [...new Set(names.filter(n=>tacticalRows(n,f.format)))];}
function tacticalBuilder(q,f){const slots=q.customOppSlots||[];return `<div class="card stack"><label class="f">Custom formation name<input class="input" id="oppCustomName" maxlength="60" value="${esc(q.oppName||'')}" placeholder="e.g. Riccall High Press"></label><label class="f">Outfield lines (goalkeeper fixed)<div class="row"><b>1 –</b><input class="input" id="oppCustomRows" value="${esc(q.customOppRows||'')}" placeholder="2-1-3-2"></div></label><button class="btn sm" data-a="oppGenerate">Generate ${f.format} positions</button>${slots.length?`<div id="oppEditor" class="formation-editor-pitch" style="touch-action:none"><div class="formation-pitch-line"></div><div class="formation-pitch-circle"></div><div class="formation-pitch-box"></div>${slots.map((p,i)=>'<button type="button" class="formation-edit-token '+(i===0?'keeper':'')+'" data-opp-slot="'+i+'" style="left:'+p.x+'%;top:'+p.y+'%;touch-action:none"><span>'+esc(p.code)+'</span></button>').join('')}</div><p class="small muted">Drag outfield markers into position. Goalkeeper stays fixed.</p><label class="f">Player role<select class="input" id="oppRoleSlot" data-a="oppRoleSlot">${slots.map((p,i)=>i?`<option value="${i}" ${i===(q.oppRoleIndex||1)?'selected':''}>Player ${i+1} · ${esc(p.code)}</option>`:'').join('')}</select><select class="input" data-a="oppRole">${POS.filter(p=>p!=='GK').map(p=>`<option ${p===slots[q.oppRoleIndex||1]?.code?'selected':''}>${esc(p)}</option>`).join('')}</select></label><button class="btn primary" data-a="oppUseCustom">Save & use custom formation</button>`:''}</div>`;}
function sheetTactical(){const q=ui.sheet,f=fixture(q.id),m=f.match,F=formationById(m?.formationId||f.formationId),rows=tacticalRows(q.theirs,f.format),tags=q.tags||[];return `<div class="row between" style="position:sticky;top:-16px;background:var(--surface);z-index:5;padding:8px 0"><h2 style="margin:0;flex:1">Tactical Assistant · ${esc(f.opponent)}</h2><button class="btn sm primary" data-a="closeSheet">Done</button></div><p class="small muted">Our formation: ${esc(F?.name||'Unknown')} · Suggestions are based on shape and your observations, not live tracking.</p><label class="f">Opposition formation · ${f.format}v${f.format}<select class="input" id="tacticalShape" data-a="oppSelect"><option value="">Choose formation</option>${tacticalOptions(f).map(n=>'<option value="'+esc(n)+'" '+(!q.oppCustom&&!q.oppLibraryId&&q.theirs===n?'selected':'')+'>1-'+esc(n)+'</option>').join('')}${oppLibrary(f).map(x=>`<option value="saved:${esc(x.id)}" ${q.oppLibraryId===x.id?'selected':''}>${esc(x.name)} (1-${esc(x.rows)})</option>`).join('')}<option value="other" ${q.oppCustom&&!q.oppLibraryId?'selected':''}>Other – create custom formation</option></select></label>${q.oppCustom?tacticalBuilder(q,f):''}<button class="btn primary" data-a="tacticalAnalyse">Compare formations</button>${rows&&F?.slots?tacticalPitch(F.slots,q.oppSlots||makeCustomSlots(rows),m?.lineup||f.plan?.blocks?.[0]?.slots,f.opponent,team().name)+tacticalAdvice(F,rows,tags):'<p class="small muted">Enter their outfield lines to compare.</p>'}<b>Quick observations</b><div class="row" style="flex-wrap:wrap;gap:6px">${Object.keys(tacticalTags).map(t=>'<button class="btn sm '+(tags.includes(t)?'primary':'')+'" data-a="tacticalTag" data-tag="'+esc(t)+'">'+esc(t)+'</button>').join('')}</div><label class="f">Match notes<textarea class="input" id="tacticalNote" rows="3">${esc(q.note||'')}</textarea></label><label class="f">What worked / reflection<textarea class="input" id="tacticalReflection" rows="2">${esc(q.reflection||'')}</textarea></label><button class="btn primary" data-a="tacticalSave">Save observation</button><details><summary>Observations this fixture (${(f.tactical||[]).length})</summary>${tacticalEntries(f)||'<p class="small muted">None yet.</p>'}</details><details><summary>Previous encounters</summary>${tacticalHistoryHtml(f,f.opponent)}</details><button class="btn" data-a="closeSheet">Done</button>`;}
function tacticalDraft(){const q=ui.sheet;if(!q.oppCustom&&!q.oppLibraryId)q.theirs=val('tacticalShape').trim();if(document.getElementById('oppCustomName'))q.oppName=val('oppCustomName').trim();if(q.oppCustom&&document.getElementById('oppCustomRows'))q.customOppRows=val('oppCustomRows').trim();q.note=val('tacticalNote');q.reflection=val('tacticalReflection');}

function renderSheet(){
  let s=document.getElementById('sheet');
  if(!ui.sheet){ if(s) s.remove(); return; }
  if(!s){ s=document.createElement('div'); s.id='sheet'; s.className='scrim'; document.body.appendChild(s); }
  let h='';
  const k=ui.sheet.k;
  if(k==='venue') h=sheetVenue();
  if(k==='awayVenue') h=sheetAwayVenue();
  if(k==='visitor') h=sheetVisitor();
  if(k==='player') h=sheetPlayer(ui.sheet.id);
  if(k==='coach') h=sheetCoach();
  if(k==='managerTask') h=sheetManagerTask();
  if(k==='teamHonour') h=sheetTeamHonour();
  if(k==='honour') h=sheetHonour();

  if(k==='mergeOpponent') h=sheetMergeOpponent();
  if(k==='notes') h=sheetCoachingNotes();
  if(k==='goal') h=sheetGoal();
  if(k==='matchEvent') h=sheetMatchEvent();
  if(k==='nextPlan') h=sheetNextPlan();
  if(k==='injury') h=sheetInjury();

  if(k==='import') h=sheetImport();
  if(k==='restore') h=`<h2>Restore backup</h2><p class="small muted" style="margin:0">Choose a saved backup file or paste a copied backup. Restoring replaces all team data on this device.</p><input class="input" type="file" id="restoreFile" accept=".json,application/json"><textarea class="input" id="restoreTxt" placeholder="Paste backup here"></textarea><div class="grid2"><button class="btn" data-a="closeSheet">Cancel</button><button class="btn primary" data-a="restore">Restore</button></div>`;
  if(k==='backup') h=`<h2>Backup</h2><p class="small muted" style="margin:0">${ui.sheet.copied?'Copied. Paste it into a note or email to yourself.':'Select all of the text below and copy it.'}</p><textarea class="input" id="backupTxt" readonly>${esc(JSON.stringify(db))}</textarea><button class="btn primary" data-a="closeSheet">Done</button>`;
  if(k==='manual') h=sheetManual();
  if(k==='goalCategories'){const o=team().statsOverride||{};h=`<h2>Edit goal categories</h2><p class="small muted">Allocate historical team goals without changing the team or player totals.</p><label class="f">Opposition own goals<input class="input" id="categoryOwn" type="number" inputmode="numeric" min="0" step="1" value="${Number(o.ownGoals)||0}"></label><label class="f">Unallocated goals<input class="input" id="categoryUnallocated" type="number" inputmode="numeric" min="0" step="1" value="${Number(o.unallocatedGoals)||0}"></label><div class="grid2"><button class="btn" data-a="closeSheet">Cancel</button><button class="btn primary" data-a="saveGoalCategories">Save</button></div>`;}
  if(k==='cards') h=sheetCards();
  if(k==='training') h=sheetTraining();
  if(k==='teamEvent') h=sheetEvent();
  if(k==='historicalAttendance') h=sheetHistoricalAttendance();
  if(k==='score') h=sheetScore();
  if(k==='team') h=`<h2>Add team</h2><label class="f">Team name<input class="input" id="ntName" placeholder="e.g. Askern Miners U10s"></label><div class="grid2"><button class="btn" data-a="closeSheet">Cancel</button><button class="btn primary" data-a="createTeam">Create</button></div>`;
  const previous=s.querySelector('.sheet'),scroll=previous?.dataset.kind===k?previous.scrollTop:0;
  s.innerHTML=`<div class="sheet sheet-v2" data-kind="${k}" role="dialog" aria-modal="true">${h}</div>`;
  const panel=s.firstElementChild,heading=panel.querySelector('h2');
  const header=document.createElement('div');header.className='sheet-header';
  const title=heading||document.createElement('h2');if(!heading)title.textContent='Details';
  const existing=heading?.parentElement;
  if(existing&&existing!==panel&&existing.querySelector('[data-a="closeSheet"]'))existing.remove();
  title.id='sheet-title';title.removeAttribute('style');header.appendChild(title);
  const close=document.createElement('button');close.className='btn sm sheet-close';close.dataset.a='closeSheet';close.textContent=['tactical','alerts','backup'].includes(k)?'Done':'Close';close.setAttribute('aria-label',close.textContent==='Done'?'Done, close panel':'Close without saving');header.appendChild(close);
  if(k==='player'){
    close.textContent='Close';close.setAttribute('aria-label','Close player editor');

    const saveButton=panel.querySelector('[data-a="savePlayer"]');
    if(saveButton){const footer=saveButton.parentElement;saveButton.className='btn primary sm sheet-close';header.appendChild(saveButton);footer.remove();}

    const saveButton=panel.querySelector(k==='teamHonour'?'[data-a="saveTeamHonour"]':'[data-a="saveHonour"]');

function sheetGoal(){

  if(!st.scorer) return `<h2>Who scored?</h2><div class="pick">${on.map(id=>`<button class="btn" data-a="pickScorer" data-id="${id}"><span class="shirt" style="width:28px;height:28px;font-size:15px">${player(id).number??''}</span>${esc(firstName(player(id)))}</button>`).join('')}<button class="btn" data-a="pickScorer" data-id="og">Own goal</button></div><button class="btn" data-a="closeSheet">Cancel</button>`;
  return `<h2>Assist?</h2><div class="pick"><button class="btn primary" data-a="pickAssist" data-id="">No assist</button>${on.filter(id=>id!==st.scorer).map(id=>`<button class="btn" data-a="pickAssist" data-id="${id}"><span class="shirt" style="width:28px;height:28px;font-size:15px">${player(id).number??''}</span>${esc(firstName(player(id)))}</button>`).join('')}</div>`;
}

/* ---------- CSV import ---------- */
function parseCSV(text){
  const rows=[]; let row=[], cell='', q=false;
  for(let i=0;i<text.length;i++){ const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else q=false; } else cell+=c; }
    else if(c==='"') q=true; else if(c===','||c==='\t'){ row.push(cell); cell=''; }
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n') i++; row.push(cell); rows.push(row); row=[]; cell=''; }
    else cell+=c; }
  if(cell!==''||row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r=>r.some(x=>x.trim()!==''));
}
function parseDate(s){
  s=s.trim(); let m;
  if((m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  if((m=s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})/))){ let y=m[3]; if(y.length===2) y='20'+y; return `${y}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`; }
  const d=new Date(s); if(!isNaN(d)) return d.toISOString().slice(0,10);
  return null;
}
function previewCSV(text){
  const rows=parseCSV(text); const out={rows:[],errors:[]};
  if(rows.length<2){ out.errors.push('Need a heading row and at least one result'); return out; }
  const h=rows[0].map(x=>x.trim().toLowerCase());
  const col=(...names)=>h.findIndex(x=>names.some(n=>x===n||x.includes(n)));
  const cD=col('date'), cO=col('opponent','opposition','vs','team'), cS=col('score','result'), cF=col('for','scored','us','gf'), cA=col('against','conceded','them','ga'), cC=col('competition','comp','type'), cV=col('venue','ground'), cH=col('home/away','h/a','home'),cG=col('goalscorers'),cFmt=col('match format'),cSeason=col('season'),cAge=col('age group'),cNotes=col('notes'),cMotm=col('potm');
  if(cD<0||cO<0){ out.errors.push('Could not find Date and Opponent columns'); return out; }
  rows.slice(1).forEach((r,i)=>{
    const date=parseDate(r[cD]||''); const opp=(r[cO]||'').trim();
    let us=null, them=null;
    if(cF>=0&&cA>=0&&r[cF]!==undefined&&r[cF].trim()!==''){ us=parseInt(r[cF]); them=parseInt(r[cA]); }
    else if(cS>=0){ const m=(r[cS]||'').match(/(\d+)\s*[-–:]\s*(\d+)/); if(m){us=+m[1];them=+m[2];} }
    if(!date||!opp||isNaN(us)||isNaN(them)||us===null){ out.errors.push(`row ${i+2}`); return; }
    const ha=cH>=0?(r[cH]||'').trim().toUpperCase()[0]:'H';
    out.rows.push({date,opponent:opp,us,them,competition:cC>=0?(r[cC]||'').trim():'',venue:cV>=0?(r[cV]||'').trim():'',homeAway:ha==='A'?'A':ha==='N'?'N':'H',scorerText:cG>=0?r[cG]||'':'',format:cFmt>=0?parseInt(r[cFmt]):null,season:cSeason>=0?r[cSeason]||'':'',ageGroup:cAge>=0?r[cAge]||'':'',notes:cNotes>=0?r[cNotes]||'':'',potm:cMotm>=0?r[cMotm]||'':''});
  });
  return out;
}

function planTap(t){

  if(!ui.sel){ if(t.t==='slot'&&!blk.slots[t.j]&&!fx.available.length) return; ui.sel=t; return; }
  const a=ui.sel, b=t; ui.sel=null;
  if(a.t==='bench'&&b.t==='bench') { ui.sel=b; return; }
  const sl=[...blk.slots];
  const get=x=>x.t==='slot'?sl[x.j]:x.id;
  if(a.t==='slot'&&b.t==='slot'){ if(a.j===b.j) return; [sl[a.j],sl[b.j]]=[sl[b.j],sl[a.j]]; }
  else { const s=a.t==='slot'?a:b, bn=a.t==='bench'?a:b; sl[s.j]=bn.id; }
  const missing=requiredForBlock(fx,ui.block).filter(id=>!sl.includes(id));
  if(missing.length){toast('Must play: '+missing.map(id=>player(id)?.name||'Player').join(', ')+' cannot be benched');return;}

}

 async function latestSave(){const uid=session.user.id,k='touchxi.cloud.revision.'+uid, path='/rest/v1/touchxi_latest_save', t=await token(), snapshot=JSON.parse(JSON.stringify(db));const list=await req(path+'?select=revision,payload&user_id=eq.'+encodeURIComponent(uid),'GET',undefined,t);const prev=list[0];if(prev&&String(prev.revision)!==localStorage.getItem(k))throw Error('Cloud revision differs; automatic save paused to protect data.');const history=await versions(), baseline=prev?.payload||(history.length?await version(history[0].id):null);if(!snapshot.teams?.length||!snapshot.players?.length||(baseline&&(!baseline.teams.every(x=>snapshot.teams.some(y=>y.id===x.id))||snapshot.players.length<baseline.players.length||snapshot.fixtures.length<baseline.fixtures.length)))throw Error('Local data appears incomplete; automatic save paused.');if(prev&&JSON.stringify(prev.payload)===JSON.stringify(snapshot))return;const revision=prev?Number(prev.revision)+1:1;const result=await req(prev?path+'?user_id=eq.'+encodeURIComponent(uid)+'&revision=eq.'+prev.revision:path,prev?'PATCH':'POST',{user_id:uid,payload:snapshot,revision,updated_at:new Date().toISOString()},t);if(!Array.isArray(result)||result.length!==1)throw Error('Cloud revision changed; automatic save paused.');localStorage.setItem(k,String(revision));}
 if(background){if(session&&localStorage.getItem('touchxi.cloud.auto.'+session.user.id)&&navigator.onLine&&!txCloudRunning){txCloudRunning=true;(async()=>{await latestSave();const list=await versions();const weekly=list.find(v=>v.kind==='weekly'||v.kind==='initial');if(!weekly||Date.now()-new Date(weekly.created_at).getTime()>=7*86400000)await backup('weekly');})().catch(e=>console.warn('TouchXI cloud save:',e.message)).finally(()=>{txCloudRunning=false;});}return;}
 draw();
